<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>英文讀默</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js?1"></script>
</head>
<body>

  <!-- 頂部導覽列：純 Icon (帶紅點提示) -->
  <header class="top-nav">
    <button class="icon-btn" onclick="openKeyModal()" title="API 金鑰設定">
      🔑
      <span id="keyDot" class="dot-badge" style="display:none;"></span>
    </button>

    <h1 class="app-title">📖 英文讀默</h1>

    <button class="icon-btn" onclick="openSettingsModal()" title="系統設定">
      ⚙️
    </button>
  </header>

  <main class="container">

    <!-- 視圖 1：【加入課文面板】 (點擊加入或無課文時顯示，此時完全隱藏播放器) -->
    <section id="viewAddLesson" class="card" style="display:none;">
      <div class="card-header">
        <h2 class="card-title">✨ 加入新課文</h2>
        <button id="btnCancelAdd" class="btn btn-outline" style="padding:6px 10px; font-size:0.85rem;" onclick="showPlayerView()">返回播放</button>
      </div>

      <!-- 可編輯輸入區域：一旦開始分析上傳，自動整塊收合，避免誤觸彈出鍵盤 -->
      <div id="addInputFields">
        <label>課文標題 (選填，留空自動命名):</label>
        <input type="text" id="newLessonTitle" placeholder="例如: Unit 1 - A Day at School">

        <label>拍攝課本相片 (OCR 辨識，選填):</label>
        <input type="file" id="ocrImageInput" accept="image/*" style="margin-bottom:8px;">

        <label>或直接貼上課文文字:</label>
        <textarea id="newLessonText" rows="4" placeholder="貼上英文段落，系統將智能分拆意群..."></textarea>

        <button id="startBuildBtn" class="btn" style="width:100%; margin-top:14px;" onclick="startSchemeBBuild()">
          🚀 開始智能分析並同步至雲端
        </button>
      </div>

      <!-- 執行中動態展示區 (只顯示標題膠囊、進度條與續傳按鈕) -->
      <div id="buildProgressBox" class="progress-box" style="display:none;">
        <div id="activeLessonCapsule" style="font-weight:700; margin-bottom:6px; color:var(--primary);">處理中...</div>
        <div id="progActionText" style="font-size:0.9rem; font-weight:600;">正在啟動...</div>
        <div class="progress-bar-bg">
          <div id="progBarFill" class="progress-bar-fill"></div>
        </div>
        <div style="display:flex; justify-content:space-between; font-size:0.8rem; color:var(--text-sub);">
          <span id="progCountText">第 0 / 0 句</span>
          <span id="progStepBadge" style="font-weight:700;">Step 1/3</span>
        </div>

        <!-- 斷點續傳按鈕：僅在失敗時動態出現 -->
        <button id="btnResumeTask" class="btn btn-warning" style="width:100%; margin-top:10px; display:none;" onclick="resumeSchemeBBuild()">
          🔄 從斷點繼續處理 (免重新 Call API)
        </button>
      </div>
    </section>

    <!-- 視圖 2：【默書播放面板】 -->
    <section id="viewPlayer" class="card" style="display:none;">
      <!-- 目錄選擇列 (課文多於 0 篇時顯示) -->
      <div id="catalogBar" class="lesson-select-bar">
        <select id="lessonSelectDropdown" onchange="onSelectLessonDropdown(this.value)"></select>
        <button class="btn" style="padding:10px 12px; font-size:0.85rem;" onclick="showAddView()">＋ 加入</button>
        <button class="btn btn-outline" style="padding:10px 10px; color:var(--danger);" onclick="deleteCurrentLesson()" title="刪除此課文">🗑️</button>
      </div>

      <!-- 狀態提示與遮蔽切換 -->
      <div style="display:flex; justify-content:space-between; align-items:center; margin:10px 0;">
        <div id="statusBanner" style="font-size:0.88rem; font-weight:600; color:var(--primary);">正在準備音檔...</div>
        <label style="margin:0; font-size:0.85rem; display:flex; align-items:center; gap:4px; cursor:pointer;">
          <input type="checkbox" id="maskToggle" onchange="renderChunks()"> 🙈 默書隱藏
        </label>
      </div>

      <!-- 播放控制鍵 -->
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-bottom:10px;">
        <button id="btnPlay" class="btn btn-success" onclick="startOrResumeDictation()" disabled>▶ 開始連續讀默</button>
        <button id="btnPause" class="btn btn-warning" onclick="pauseDictation()" disabled>⏸ 暫停</button>
      </div>
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-bottom:12px;">
        <button id="btnReplay" class="btn btn-outline" onclick="replayCurrentChunk()" disabled>🔄 重播此句</button>
        <button id="btnStop" class="btn btn-outline" onclick="stopDictation()" disabled>⏹ 停止</button>
      </div>

      <!-- 單一原生音訊實例 (iOS 背景保活通道) -->
      <audio id="mainAudio" playsinline controls style="width:100%; margin-bottom:10px;"></audio>

      <!-- 意群清單 -->
      <div id="chunkContainer" class="chunk-grid"></div>
    </section>

  </main>

  <!-- 左上：API 金鑰設定 Modal -->
  <div id="keyModal" class="modal-backdrop">
    <div class="modal">
      <div class="card-header">
        <h3 class="card-title">🔑 API 金鑰設定</h3>
        <button class="icon-btn" style="width:32px; height:32px; border:none;" onclick="closeModal('keyModal')">✕</button>
      </div>
      <p style="font-size:0.8rem; color:var(--text-sub); margin-top:0;">設定加密存於雲端，跨裝置永久同步。</p>

      <div id="keyListContainer"></div>

      <button id="btnSaveKeys" class="btn" style="width:100%; margin-top:16px;" onclick="saveKeysToCloud()">
        💾 儲存並關閉
      </button>
    </div>
  </div>

  <!-- 右上：系統設定 Modal (含 3 大步進器，關閉時才同步雲端) -->
  <div id="settingsModal" class="modal-backdrop">
    <div class="modal">
      <div class="card-header">
        <h3 class="card-title">⚙️ 系統設定</h3>
        <button class="icon-btn" style="width:32px; height:32px; border:none;" onclick="closeSettingsModalAndSync()">✕</button>
      </div>

      <label>預設語音模型:</label>
      <select id="modalVoiceSelect" style="margin-bottom:12px;"></select>

      <label>分拆 / OCR 模型:</label>
      <select id="modalModelSelect" style="margin-bottom:16px;"></select>

      <!-- 步進器 1：播放速度 (0.50 ~ 1.50，幅度 0.05，預設 0.80) -->
      <div class="stepper-group">
        <div class="stepper-label">
          <span>播放語速</span>
          <span style="color:var(--text-sub);">0.50x ~ 1.50x</span>
        </div>
        <div class="stepper">
          <button class="stepper-btn" onclick="stepVal('playbackRate', -0.05, 0.50, 1.50, 2)">－</button>
          <input type="text" id="step_playbackRate" class="stepper-display" readonly>
          <button class="stepper-btn" onclick="stepVal('playbackRate', 0.05, 0.50, 1.50, 2)">＋</button>
        </div>
      </div>

      <!-- 步進器 2：讀幾次 (1 ~ 5 次，幅度 1，預設 2) -->
      <div class="stepper-group">
        <div class="stepper-label">
          <span>每句朗讀次數</span>
          <span style="color:var(--text-sub);">1 ~ 5 次</span>
        </div>
        <div class="stepper">
          <button class="stepper-btn" onclick="stepVal('repeatCount', -1, 1, 5, 0)">－</button>
          <input type="text" id="step_repeatCount" class="stepper-display" readonly>
          <button class="stepper-btn" onclick="stepVal('repeatCount', 1, 1, 5, 0)">＋</button>
        </div>
      </div>

      <!-- 步進器 3：停頓時間倍率 (0.5 ~ 2.0，幅度 0.1，預設 1.0) -->
      <div class="stepper-group">
        <div class="stepper-label">
          <span>停頓時間倍率</span>
          <span style="color:var(--text-sub);">0.5x ~ 2.0x</span>
        </div>
        <div class="stepper">
          <button class="stepper-btn" onclick="stepVal('pauseMultiplier', -0.1, 0.5, 2.0, 1)">－</button>
          <input type="text" id="step_pauseMultiplier" class="stepper-display" readonly>
          <button class="stepper-btn" onclick="stepVal('pauseMultiplier', 0.1, 0.5, 2.0, 1)">＋</button>
        </div>
      </div>

      <button class="btn" style="width:100%; margin-top:8px;" onclick="closeSettingsModalAndSync()">
        💾 儲存設定並同步
      </button>
    </div>
  </div>

  <script>
    /**
     * ========================================================================
     * 全域狀態
     * ========================================================================
     */
    let serverState = {
      keyStatus: {},
      settings: {
        ttsVoice: 'en-HK-YanNeural',
        geminiModel: 'gemini-3.6-flash',
        playbackRate: 0.80,
        repeatCount: 2,
        pauseMultiplier: 1.0
      }
    };

    let tempSettings = {}; // Modal 內微調用的暫存物件
    let lessonsIndex = [];
    let currentLesson = null;
    let audioBlobUrls = {};

    // 方案 B 斷點續傳任務狀態
    let activeTask = null;

    // 讀默播放狀態機
    let dictation = {
      isRunning: false,
      isPaused: false,
      chunkIdx: 0,
      pass: 1,
      timer: null
    };

    // iOS Web Audio 靜音保活引擎
    let keepAliveCtx = null;
    function unlockIosAudioKeepAlive() {
      try {
        if (!keepAliveCtx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          keepAliveCtx = new AudioCtx();
          const osc = keepAliveCtx.createOscillator();
          const gain = keepAliveCtx.createGain();
          gain.gain.value = 0.00001;
          osc.connect(gain);
          gain.connect(keepAliveCtx.destination);
          osc.start();
        }
        if (keepAliveCtx.state === 'suspended') keepAliveCtx.resume();
      } catch (e) {}
    }

    /**
     * ========================================================================
     * 初始化
     * ========================================================================
     */
    window.onload = async function() {
      initDropdownOptions();
      await syncStateFromGAS();
      await loadLessonsIndex();
    };

    function initDropdownOptions() {
      const vSel = document.getElementById('modalVoiceSelect');
      vSel.innerHTML = APP_CONFIG.TTS_VOICES.map(v => `<option value="${v.id}">${v.label}</option>`).join('');

      const mSel = document.getElementById('modalModelSelect');
      mSel.innerHTML = APP_CONFIG.GEMINI_MODELS.map(m => `<option value="${m.id}">${m.label}</option>`).join('');
    }

    async function callGAS(action, payloadObj = {}) {
      const res = await fetch(APP_CONFIG.GAS_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, ...payloadObj })
      });
      const json = await res.json();
      if (!json.success) throw new Error(json.error || "GAS 伺服器錯誤");
      return json.data;
    }

    async function syncStateFromGAS() {
      try {
        serverState = await callGAS('getInitState');
        updateKeyDotAlert();
        applyPlaybackRateToPlayer();
      } catch (e) {
        console.error("GAS 連線失敗:", e);
      }
    }

    function updateKeyDotAlert() {
      const ks = serverState.keyStatus;
      const hasTts = ks['GOOGLE_TTS_KEY'] || ks['AZURE_TTS_KEY'];
      const ok = ks['GEMINI_API_KEY'] && ks['GITHUB_TOKEN'] && hasTts;
      document.getElementById('keyDot').style.display = ok ? 'none' : 'block';
    }

    function applyPlaybackRateToPlayer() {
      const p = document.getElementById('mainAudio');
      if (p) p.playbackRate = serverState.settings.playbackRate;
    }

    /**
     * ========================================================================
     * 視圖切換邏輯 (合理收合 / 互斥顯示)
     * ========================================================================
     */
    function showAddView() {
      document.getElementById('viewPlayer').style.display = 'none';
      document.getElementById('viewAddLesson').style.display = 'block';
      document.getElementById('addInputFields').style.display = 'block';
      document.getElementById('buildProgressBox').style.display = 'none';
      document.getElementById('btnCancelAdd').style.display = (lessonsIndex.length > 0) ? 'inline-block' : 'none';
    }

    function showPlayerView() {
      if (lessonsIndex.length === 0) {
        showAddView();
        return;
      }
      document.getElementById('viewAddLesson').style.display = 'none';
      document.getElementById('viewPlayer').style.display = 'block';
    }

    /**
     * ========================================================================
     * 課文目錄讀取與切換
     * ========================================================================
     */
    function getRawUrl(path) {
      const { owner, assetsRepo, branch } = APP_CONFIG.GITHUB;
      return `https://raw.githubusercontent.com/${owner}/${assetsRepo}/${branch}/${path}?t=${Date.now()}`;
    }

    function getCdnUrl(path) {
      const { owner, assetsRepo, branch } = APP_CONFIG.GITHUB;
      return `https://cdn.jsdelivr.net/gh/${owner}/${assetsRepo}@${branch}/${path}`;
    }

    async function loadLessonsIndex() {
      try {
        const res = await fetch(getRawUrl('lessons/index.json'));
        lessonsIndex = res.ok ? await res.json() : [];
      } catch (e) {
        lessonsIndex = [];
      }

      if (lessonsIndex.length === 0) {
        showAddView();
      } else {
        renderLessonDropdown();
        showPlayerView();
        selectLesson(lessonsIndex[0].id);
      }
    }

    function renderLessonDropdown() {
      const sel = document.getElementById('lessonSelectDropdown');
      sel.innerHTML = lessonsIndex.map(item => `
        <option value="${item.id}" ${currentLesson && currentLesson.id === item.id ? 'selected' : ''}>
          ${escapeHtml(item.title)} (${item.chunkCount}組)
        </option>
      `).join('');
    }

    function onSelectLessonDropdown(id) {
      selectLesson(id);
    }

    async function selectLesson(lessonId) {
      stopDictation();
      const banner = document.getElementById('statusBanner');
      banner.innerText = "⏳ 正在預載音檔...";
      document.getElementById('btnPlay').disabled = true;

      try {
        const res = await fetch(getRawUrl(`lessons/lesson_${lessonId}.json`));
        if (!res.ok) throw new Error("找不到課文 JSON");
        currentLesson = await res.json();

        renderLessonDropdown();
        renderChunks();

        Object.values(audioBlobUrls).forEach(u => URL.revokeObjectURL(u));
        audioBlobUrls = {};

        let loaded = 0;
        const total = currentLesson.chunks.length;

        await Promise.all(currentLesson.chunks.map(async (chunk) => {
          let blobUrl = null;
          try {
            const r = await fetch(getCdnUrl(chunk.audioPath));
            if (r.ok) {
              const b = await r.blob();
              blobUrl = URL.createObjectURL(b);
            }
          } catch (e) {}

          if (!blobUrl) {
            const fb = await callGAS('fallbackGetAudio', {
              payload: { lessonTitle: currentLesson.title, voiceName: currentLesson.voiceName, chunk: chunk }
            });
            blobUrl = fb.audioData;
          }

          audioBlobUrls[chunk.index] = blobUrl;
          loaded++;
          banner.innerText = `⚡ 預載中 (${loaded}/${total})...`;
        }));

        banner.innerText = `✅ 已就緒 (共 ${total} 組)`;
        document.getElementById('btnPlay').disabled = false;
        document.getElementById('btnReplay').disabled = false;

      } catch (e) {
        banner.innerText = "❌ 載入失敗: " + e.message;
      }
    }

    function renderChunks() {
      const cont = document.getElementById('chunkContainer');
      if (!currentLesson) { cont.innerHTML = ''; return; }

      const isMasked = document.getElementById('maskToggle').checked;
      const mult = serverState.settings.pauseMultiplier;

      cont.innerHTML = currentLesson.chunks.map((c, idx) => {
        const waitSec = (c.pauseSeconds * mult).toFixed(1);
        const isActive = dictation.isRunning && dictation.chunkIdx === idx;
        return `
          <div id="chunk_${idx}" class="chunk-card ${isActive ? 'active' : ''}" onclick="playPreview(${idx})">
            <span class="chunk-text ${isMasked ? 'masked' : ''}">${idx + 1}. ${escapeHtml(c.text)}</span>
            <span class="chunk-badge">${waitSec}s</span>
          </div>
        `;
      }).join('');
    }

    /**
     * ========================================================================
     * 方案 B 建置流水線 (含斷點續傳)
     * ========================================================================
     */
    async function startSchemeBBuild() {
      const title = document.getElementById('newLessonTitle').value.trim();
      const rawText = document.getElementById('newLessonText').value.trim();
      const fileInput = document.getElementById('ocrImageInput');

      if (!rawText && (!fileInput.files || fileInput.files.length === 0)) {
        alert("請貼上課文文字或選取課本照片！");
        return;
      }

      // 開始處理：隱藏所有輸入框防誤觸，展現進度區
      document.getElementById('addInputFields').style.display = 'none';
      document.getElementById('buildProgressBox').style.display = 'block';
      document.getElementById('btnResumeTask').style.display = 'none';

      try {
        let b64 = null, mime = null;
        if (fileInput.files && fileInput.files.length > 0) {
          const f = fileInput.files[0];
          mime = f.type;
          b64 = await fileToBase64(f);
        }

        updateBuildUI(1, 3, "正在呼叫 Gemini 進行 OCR 與意群分拆...", 0, 1);
        const step1Data = await callGAS('step1_analyzeAndPrepare', {
          payload: {
            title: title,
            rawText: rawText,
            imageBase64: b64,
            imageMimeType: mime,
            geminiModel: serverState.settings.geminiModel,
            voiceName: serverState.settings.ttsVoice
          }
        });

        activeTask = {
          fullTaskState: step1Data,
          batchSize: APP_CONFIG.TTS_BATCH_SIZE || 5,
          currentBatchStart: 0
        };

        document.getElementById('activeLessonCapsule').innerText = `課文: ${step1Data.title}`;
        await executeBatchPipeline();

      } catch (err) {
        showPipelineError(err.message);
      }
    }

    async function executeBatchPipeline() {
      const { fullTaskState, batchSize } = activeTask;
      const total = fullTaskState.chunks.length;

      for (let i = activeTask.currentBatchStart; i < total; i += batchSize) {
        activeTask.currentBatchStart = i;
        const batch = fullTaskState.chunks.slice(i, i + batchSize);

        updateBuildUI(2, 3, `TTS 生成中並同步上傳 GitHub (${i}/${total})...`, i, total);

        const res = await callGAS('step2_schemeB_batchTTSAndBlobs', {
          payload: {
            batchChunks: batch,
            voiceName: fullTaskState.voiceName,
            driveFolderId: fullTaskState.driveFolderId,
            ghConfig: APP_CONFIG.GITHUB,
            fullTaskState: fullTaskState
          }
        });

        activeTask.fullTaskState = res.updatedFullState;
      }

      updateBuildUI(3, 3, "進行 GitHub 單次 Commit 與建立結構檔...", total, total);
      const step3Res = await callGAS('step3_commitToGitHub', {
        payload: { fullTaskState: activeTask.fullTaskState, ghConfig: APP_CONFIG.GITHUB }
      });

      lessonsIndex = step3Res.indexList;
      activeTask = null;

      // 完成：切換至播放模式
      document.getElementById('newLessonTitle').value = '';
      document.getElementById('newLessonText').value = '';
      document.getElementById('ocrImageInput').value = '';
      showPlayerView();
      await selectLesson(step3Res.lesson.id);
    }

    function resumeSchemeBBuild() {
      if (!activeTask) return;
      document.getElementById('btnResumeTask').style.display = 'none';
      executeBatchPipeline().catch(err => showPipelineError(err.message));
    }

    function showPipelineError(msg) {
      document.getElementById('progActionText').innerText = "❌ 處理暫停: " + msg;
      document.getElementById('btnResumeTask').style.display = 'block';
    }

    function updateBuildUI(step, totalSteps, action, done, total) {
      document.getElementById('progStepBadge').innerText = `Step ${step}/${totalSteps}`;
      document.getElementById('progActionText').innerText = action;
      const pct = total > 0 ? Math.round((done / total) * 100) : 0;
      document.getElementById('progBarFill').style.width = pct + '%';
      document.getElementById('progCountText').innerText = `已完成 ${done} / ${total} 句`;
    }

    async function deleteCurrentLesson() {
      if (!currentLesson) return;
      if (!confirm(`確定要刪除課文「${currentLesson.title}」嗎？\n(Drive 內的 MP3 將會保留)`)) return;

      document.getElementById('statusBanner').innerText = "🗑️ 刪除中...";
      try {
        const res = await callGAS('deleteLesson', {
          payload: { lessonId: currentLesson.id, ghConfig: APP_CONFIG.GITHUB }
        });
        lessonsIndex = res.indexList;
        currentLesson = null;
        if (lessonsIndex.length === 0) {
          showAddView();
        } else {
          selectLesson(lessonsIndex[0].id);
        }
      } catch (e) {
        alert("刪除失敗: " + e.message);
      }
    }

    /**
     * ========================================================================
     * iOS 讀默連續播放引擎
     * ========================================================================
     */
    function playPreview(idx) {
      if (!currentLesson || !audioBlobUrls[idx]) return;
      stopDictation();
      unlockIosAudioKeepAlive();

      dictation.chunkIdx = idx;
      highlightChunk(idx);

      const p = document.getElementById('mainAudio');
      p.src = audioBlobUrls[idx];
      p.playbackRate = serverState.settings.playbackRate;
      p.onended = null;
      p.play();
      document.getElementById('statusBanner').innerText = `🔊 單句預覽: 第 ${idx + 1} 組`;
    }

    function startOrResumeDictation() {
      if (!currentLesson) return;
      unlockIosAudioKeepAlive();

      if (dictation.isRunning && dictation.isPaused) {
        dictation.isPaused = false;
        document.getElementById('btnPlay').disabled = true;
        document.getElementById('btnPause').disabled = false;
        runStep();
        return;
      }

      dictation.isRunning = true;
      dictation.isPaused = false;
      dictation.chunkIdx = 0;
      dictation.pass = 1;

      document.getElementById('btnPlay').disabled = true;
      document.getElementById('btnPause').disabled = false;
      document.getElementById('btnStop').disabled = false;

      runStep();
    }

    function runStep() {
      if (!dictation.isRunning || dictation.isPaused || !currentLesson) return;

      const idx = dictation.chunkIdx;
      const total = currentLesson.chunks.length;
      const totalPass = serverState.settings.repeatCount;

      if (idx >= total) {
        stopDictation();
        document.getElementById('statusBanner').innerText = "🎉 課文讀默已完成！";
        return;
      }

      const chunk = currentLesson.chunks[idx];
      highlightChunk(idx);

      const banner = document.getElementById('statusBanner');
      banner.innerText = `🔊 朗讀中 (${idx + 1}/${total}) [第 ${dictation.pass}/${totalPass} 次]`;

      const player = document.getElementById('mainAudio');
      player.src = audioBlobUrls[idx];
      player.playbackRate = serverState.settings.playbackRate;

      player.onended = () => {
        if (!dictation.isRunning || dictation.isPaused) return;

        const waitSec = Math.max(1, Math.round(chunk.pauseSeconds * serverState.settings.pauseMultiplier));
        let remain = waitSec;
        banner.innerText = `✍️ 請默寫第 ${idx + 1} 組... (${remain}s)`;

        clearInterval(dictation.timer);
        dictation.timer = setInterval(() => {
          if (dictation.isPaused || !dictation.isRunning) {
            clearInterval(dictation.timer);
            return;
          }
          remain--;
          if (remain > 0) {
            banner.innerText = `✍️ 請默寫第 ${idx + 1} 組... (${remain}s)`;
          } else {
            clearInterval(dictation.timer);
            if (dictation.pass < totalPass) {
              dictation.pass++;
            } else {
              dictation.chunkIdx++;
              dictation.pass = 1;
            }
            runStep();
          }
        }, 1000);
      };

      player.play().catch(() => {
        banner.innerText = "⚠️ 點擊「繼續」解鎖 iOS 播放";
        pauseDictation();
      });
    }

    function pauseDictation() {
      if (!dictation.isRunning) return;
      dictation.isPaused = true;
      clearInterval(dictation.timer);
      document.getElementById('mainAudio').pause();

      const btn = document.getElementById('btnPlay');
      btn.innerText = "▶ 繼續";
      btn.disabled = false;
      document.getElementById('btnPause').disabled = true;
      document.getElementById('statusBanner').innerText = "⏸ 讀默暫停";
    }

    function stopDictation() {
      dictation.isRunning = false;
      dictation.isPaused = false;
      clearInterval(dictation.timer);

      const p = document.getElementById('mainAudio');
      p.pause();
      p.onended = null;

      const btn = document.getElementById('btnPlay');
      btn.innerText = "▶ 開始連續讀默";
      btn.disabled = !currentLesson;
      document.getElementById('btnPause').disabled = true;
      document.getElementById('btnStop').disabled = true;
      highlightChunk(-1);
    }

    function replayCurrentChunk() {
      if (!currentLesson) return;
      clearInterval(dictation.timer);
      if (dictation.isRunning) {
        dictation.isPaused = false;
        runStep();
      } else {
        playPreview(dictation.chunkIdx || 0);
      }
    }

    function highlightChunk(idx) {
      if (!currentLesson) return;
      currentLesson.chunks.forEach((_, i) => {
        const el = document.getElementById(`chunk_${i}`);
        if (el) {
          if (i === idx) {
            el.classList.add('active');
            el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          } else {
            el.classList.remove('active');
          }
        }
      });
    }

    /**
     * ========================================================================
     * Key Modal 控制 (已設定則折疊為單行，點擊才展開)
     * ========================================================================
     */
    function openKeyModal() {
      renderKeyRows();
      openModal('keyModal');
    }

    function renderKeyRows() {
      const keysConfig = [
        { id: 'GEMINI_API_KEY', label: 'Gemini API Key' },
        { id: 'GOOGLE_TTS_KEY', label: 'Google Cloud TTS Key' },
        { id: 'AZURE_TTS_KEY', label: 'Microsoft Azure TTS Key' },
        { id: 'GITHUB_TOKEN', label: 'GitHub Personal Token' }
      ];

      const cont = document.getElementById('keyListContainer');
      cont.innerHTML = keysConfig.map(k => {
        const isSet = serverState.keyStatus[k.id];
        if (isSet) {
          return `
            <div class="key-block">
              <div class="key-header-row">
                <span class="key-title">${k.label}</span>
              </div>
              <div class="key-sub-row">
                <span class="badge-tag ok">✅ 已安全加密儲存</span>
                <button class="btn btn-outline" style="padding:4px 8px; font-size:0.78rem;" onclick="revealKeyInput('${k.id}')">✏️ 更改</button>
              </div>
              <div id="wrapper_${k.id}" style="display:none; margin-top:8px;">
                <input type="password" id="input_${k.id}" placeholder="輸入新金鑰以覆蓋">
              </div>
            </div>
          `;
        } else {
          return `
            <div class="key-block">
              <div class="key-header-row">
                <span class="key-title">${k.label}</span>
                <span class="badge-tag warn">⚠️ 尚未設定</span>
              </div>
              <div style="margin-top:6px;">
                <input type="password" id="input_${k.id}" placeholder="請在此貼上 API Key">
              </div>
            </div>
          `;
        }
      }).join('');
    }

    function revealKeyInput(id) {
      const wrap = document.getElementById(`wrapper_${id}`);
      if (wrap) wrap.style.display = (wrap.style.display === 'none') ? 'block' : 'none';
    }

    async function saveKeysToCloud() {
      const btn = document.getElementById('btnSaveKeys');
      btn.disabled = true;
      btn.innerText = "儲存中...";

      const keys = {};
      ['GEMINI_API_KEY', 'GOOGLE_TTS_KEY', 'AZURE_TTS_KEY', 'GITHUB_TOKEN'].forEach(k => {
        const inp = document.getElementById(`input_${k}`);
        if (inp && inp.value.trim() !== '') keys[k] = inp.value.trim();
      });

      try {
        serverState = await callGAS('saveKeys', { keys });
        updateKeyDotAlert();
        closeModal('keyModal');
      } catch (e) {
        alert("儲存金鑰失敗: " + e.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "💾 儲存並關閉";
      }
    }

    /**
     * ========================================================================
     * 系統設定 Modal 控制 (含步進器，關閉時才進行雲端同步)
     * ========================================================================
     */
    function openSettingsModal() {
      tempSettings = { ...serverState.settings };
      document.getElementById('modalVoiceSelect').value = tempSettings.ttsVoice;
      document.getElementById('modalModelSelect').value = tempSettings.geminiModel;

      updateStepperUI('playbackRate', 2);
      updateStepperUI('repeatCount', 0);
      updateStepperUI('pauseMultiplier', 1);

      openModal('settingsModal');
    }

    function stepVal(key, delta, min, max, fixedDigits) {
      let val = tempSettings[key] + delta;
      if (val < min) val = min;
      if (val > max) val = max;
      tempSettings[key] = parseFloat(val.toFixed(2));
      updateStepperUI(key, fixedDigits);
    }

    function updateStepperUI(key, fixedDigits) {
      const el = document.getElementById(`step_${key}`);
      if (el) {
        let displayVal = tempSettings[key];
        el.value = (fixedDigits > 0) ? Number(displayVal).toFixed(fixedDigits) : displayVal;
      }
    }

    async function closeSettingsModalAndSync() {
      tempSettings.ttsVoice = document.getElementById('modalVoiceSelect').value;
      tempSettings.geminiModel = document.getElementById('modalModelSelect').value;

      closeModal('settingsModal');

      try {
        serverState = await callGAS('saveSettings', { settings: tempSettings });
        applyPlaybackRateToPlayer();
        renderChunks();
      } catch (e) {
        console.error("同步設定失敗:", e);
      }
    }

    /**
     * ========================================================================
     * 工具函數
     * ========================================================================
     */
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, s => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[s]));
    }
  </script>
</body>
