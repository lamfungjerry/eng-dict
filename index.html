<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>英文智能讀默</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
</head>
<body>

  <!-- 頂部導覽列：純 Icon (帶紅點提示) -->
  <header class="top-nav">
    <button class="icon-btn" onclick="openKeyModal()" aria-label="API 金鑰設定">
      🔑
      <span id="keyMissingDot" class="dot-badge" style="display:none;"></span>
    </button>

    <h1 class="app-title">📖 英文讀默</h1>

    <button class="icon-btn" onclick="openSettingsModal()" aria-label="系統設定">
      ⚙️
    </button>
  </header>

  <main class="container">

    <!-- 全域載入中遮罩 (含旋轉漏斗) -->
    <div id="globalLoadingCard" class="card" style="text-align:center; padding:30px 16px;">
      <div style="font-size:1.1rem; font-weight:700; color:var(--primary);">
        <span class="loading-hourglass">⏳</span> 連線系統中...
      </div>
    </div>

    <!-- 雲端未完成任務提示 -->
    <div id="cloudResumeBanner" class="card" style="display:none; background:#fffbeb; border-color:#fde68a;">
      <div style="font-weight:700; font-size:0.92rem; color:#b45309; margin-bottom:8px;">
        ⚠️ 發現未完成課文：<span id="resumeLessonName"></span>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-warning" style="flex:1; padding:10px;" onclick="resumeFromCloudTask()">🔄 繼續處理</button>
        <button class="btn btn-outline" style="padding:10px 14px;" onclick="discardCloudTask()">捨棄</button>
      </div>
    </div>

    <!-- 視圖 A：【加入課文介面】 -->
    <section id="viewAddLesson" class="card" style="display:none;">
      <div class="card-header">
        <h2 class="card-title">✨ 加入新課文</h2>
        <button id="btnBackToPlayer" class="btn btn-outline" style="padding:6px 12px; font-size:0.85rem; display:none;" onclick="switchView('PLAYER')">返回播放</button>
      </div>

      <div id="addFormArea">
        <div style="display:flex; gap:10px; align-items:center; margin-bottom:12px;">
          <label for="ocrImageInput" class="big-upload-btn">
            📷 拍攝或選取相片
          </label>
          <input type="file" id="ocrImageInput" accept="image/*" style="display:none;" onchange="onImageSelected()">

          <button type="button" id="btnCopyPrompt" class="btn btn-outline" style="padding:13px 12px; font-size:0.88rem; white-space:nowrap;" onclick="copySystemPrompt()">
            📋 複製 Prompt
          </button>
        </div>

        <div id="selectedImageHint" style="display:none; margin-bottom:12px; padding:10px 12px; background:#f0fdf4; border:1.5px solid #bbf7d0; border-radius:10px; font-size:0.86rem; justify-content:space-between; align-items:center;">
          <span id="selectedImageName" style="color:#166534; font-weight:700;"></span>
          <button type="button" class="btn btn-outline" style="padding:4px 8px; font-size:0.75rem;" onclick="clearSelectedImage()">✕ 移除</button>
        </div>

        <label style="margin-top:6px;">貼上外部 AI 分析的 JSON (選填):</label>
        <textarea id="jsonInputText" rows="6" placeholder="如 Gemini 額度忙碌，可複製 Prompt 給其他 AI 分析，並將輸出的純 JSON 貼於此處..." oninput="validateInputState()"></textarea>
        <div id="jsonValidHint" style="font-size:0.82rem; margin-top:4px; font-weight:600; display:none;"></div>

        <button id="btnStartBuild" class="btn" style="width:100%; margin-top:16px; padding:14px;" onclick="startBuildProcess()" disabled>
          🚀 開始製作讀默
        </button>
      </div>

      <div id="buildProgressArea" class="progress-box" style="display:none;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span id="progStepPill" style="background:var(--primary); color:#fff; font-size:0.75rem; font-weight:700; padding:3px 8px; border-radius:6px;">Step 1 / 3</span>
          <span id="progPercentText" style="font-size:0.85rem; font-weight:700; color:var(--primary);">0%</span>
        </div>
        <div id="progTargetTitle" style="font-weight:700; font-size:0.96rem; margin:6px 0;">準備中...</div>
        <div id="progCurrentAction" style="font-size:0.88rem; color:var(--text-sub);">
          <span class="loading-hourglass">⏳</span> 初始化中...
        </div>

        <div class="progress-bar-bg">
          <div id="progBarFill" class="progress-bar-fill"></div>
        </div>

        <div style="display:flex; justify-content:space-between; font-size:0.82rem; color:var(--text-sub); font-weight:600;">
          <span id="progDoneStat">已完成: 0</span>
          <span id="progRemainStat">尚餘: 0</span>
        </div>

        <button id="btnResumeOnError" class="btn btn-warning" style="width:100%; margin-top:14px; display:none;" onclick="continuePipelineFromCheckpoint()">
          🔄 繼續處理
        </button>
      </div>
    </section>

    <!-- 視圖 B：【播放介面】 -->
    <section id="viewPlayer" class="card" style="display:none;">
      <div id="catalogBar" class="lesson-select-bar">
        <select id="lessonDropdown" onchange="selectLesson(this.value)"></select>
        <button class="btn" style="padding:10px 14px; font-size:0.86rem;" onclick="switchView('ADD')">＋ 加入</button>
        <button class="btn btn-outline" style="padding:10px 12px; color:var(--danger);" onclick="deleteCurrentLesson()" title="刪除課文">🗑️</button>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; margin:10px 0;">
        <div id="playerBanner" style="font-size:0.88rem; font-weight:600; color:var(--primary);">準備中...</div>
        <!-- 隱藏文字開關 (預設勾選，本機鎖定時禁止取消勾選) -->
        <label id="maskLabelContainer" style="margin:0; font-size:0.84rem; display:flex; align-items:center; gap:5px; cursor:pointer;">
          <input type="checkbox" id="maskTextCheckbox" onchange="renderChunks()" checked> 🙈 隱藏文字 <span id="maskLockIndicator" style="display:none; font-size:0.8rem;">🔒</span>
        </label>
      </div>

      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-bottom:8px;">
        <button id="btnPlay" class="btn btn-success" onclick="startOrResumeDictation()" disabled>▶ 開始讀默</button>
        <button id="btnPause" class="btn btn-warning" onclick="pauseDictation()" disabled>⏸ 暫停</button>
      </div>
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-bottom:12px;">
        <button id="btnReplay" class="btn btn-outline" onclick="replayCurrentChunk()" disabled>🔄 重播此句</button>
        <button id="btnStop" class="btn btn-outline" onclick="stopDictation()" disabled>⏹ 停止</button>
      </div>

      <audio id="mainAudio" playsinline controls style="width:100%; margin-bottom:8px;"></audio>
      <div id="chunkListContainer" class="chunk-grid"></div>
    </section>

  </main>

  <!-- 左上：API Key 設定 Modal -->
  <div id="keyModal" class="modal-backdrop">
    <div class="modal">
      <div class="card-header">
        <h3 class="card-title">🔑 API 金鑰設定</h3>
        <button class="modal-close-btn" onclick="closeKeyModal()">✕</button>
      </div>
      <div id="keyItemsContainer"></div>
      <button id="btnKeySubmit" class="btn" style="width:100%; margin-top:16px;" onclick="onKeyModalSubmit()">
        關閉
      </button>
    </div>
  </div>

  <!-- 右上：系統設定 Modal -->
  <div id="settingsModal" class="modal-backdrop">
    <div class="modal">
      <div class="card-header">
        <h3 class="card-title">⚙️ 系統設定</h3>
        <button class="modal-close-btn" onclick="closeSettingsModal()">✕</button>
      </div>

      <label>語音模型:</label>
      <select id="setVoiceSelect" style="margin-bottom:10px;" onchange="markSettingsDirty()">
        <optgroup label="Microsoft Azure">
          <option value="en-HK-YanNeural">港澳英文女老師 (Yan)</option>
          <option value="en-HK-SamNeural">港澳英文男老師 (Sam)</option>
        </optgroup>
        <optgroup label="Google Cloud">
          <option value="en-US-Chirp3-HD-Aoede">美式自然女聲 (Aoede)</option>
          <option value="en-US-Chirp3-HD-Kore">美式清晰女聲 (Kore)</option>
          <option value="en-US-Chirp3-HD-Leda">美式溫柔女聲 (Leda)</option>
          <option value="en-US-Chirp3-HD-Zephyr">美式輕快女聲 (Zephyr)</option>
          <option value="en-US-Chirp3-HD-Puck">美式活力男聲 (Puck)</option>
          <option value="en-US-Chirp3-HD-Charon">美式沉穩男聲 (Charon)</option>
          <option value="en-US-Chirp3-HD-Fenrir">美式渾厚男聲 (Fenrir)</option>
          <option value="en-US-Chirp3-HD-Orus">美式標準男聲 (Orus)</option>
        </optgroup>
      </select>

      <label>句子分拆模型:</label>
      <select id="setGeminiSelect" style="margin-bottom:14px;" onchange="markSettingsDirty()">
        <option value="gemini-3.6-flash">Gemini 3.6 Flash</option>
        <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
        <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
      </select>

      <!-- 2x2 卡片區 -->
      <div class="stepper-cards-row">
        <!-- 卡片 1: 播放語速 -->
        <div class="stepper-mini-card">
          <div class="stepper-mini-title">播放語速</div>
          <div class="stepper-control">
            <button type="button" class="stepper-btn" onclick="stepSetting('playbackRate', 0.05, 0.5, 1.5, 2)">＋</button>
            <input type="text" id="input_playbackRate" class="stepper-display" readonly>
            <button type="button" class="stepper-btn" onclick="stepSetting('playbackRate', -0.05, 0.5, 1.5, 2)">－</button>
          </div>
        </div>

        <!-- 卡片 2: 朗讀次數 -->
        <div class="stepper-mini-card">
          <div class="stepper-mini-title">朗讀次數</div>
          <div class="stepper-control">
            <button type="button" class="stepper-btn" onclick="stepSetting('repeatCount', 1, 1, 5, 0)">＋</button>
            <input type="text" id="input_repeatCount" class="stepper-display" readonly>
            <button type="button" class="stepper-btn" onclick="stepSetting('repeatCount', -1, 1, 5, 0)">－</button>
          </div>
        </div>

        <!-- 卡片 3: 停頓倍率 -->
        <div class="stepper-mini-card">
          <div class="stepper-mini-title">停頓倍率</div>
          <div class="stepper-control">
            <button type="button" class="stepper-btn" onclick="stepSetting('pauseMultiplier', 0.1, 0.5, 2.0, 1)">＋</button>
            <input type="text" id="input_pauseMultiplier" class="stepper-display" readonly>
            <button type="button" class="stepper-btn" onclick="stepSetting('pauseMultiplier', -0.1, 0.5, 2.0, 1)">－</button>
          </div>
        </div>

        <!-- 卡片 4: 本機顯示文字鎖定/解鎖 -->
        <div id="cardTextLock" class="stepper-mini-card lock-card is-locked">
          <div id="cardTextLockTitle" class="stepper-mini-title" style="color:#dc2626;">顯示文字</div>
          <div class="stepper-control">
            <button type="button" id="btnToggleLock" class="lock-action-btn btn-to-unlock" onclick="handleLockToggle()">
              解鎖
            </button>
          </div>
        </div>
      </div>

      <!-- 整行按鈕：一鍵鎖定全屋所有裝置 (只在本機已解鎖時出現) -->
      <button type="button" id="btnRevokeAllLocks" class="btn-lock-all-devices" onclick="handleRevokeAllDevices()">
        🔒 一鍵鎖定所有裝置
      </button>

      <button id="btnSettingsSubmit" class="btn" style="width:100%; margin-top:4px;" onclick="onSettingsModalSubmit()">
        關閉
      </button>
    </div>
  </div>

  <script>
    /**
     * ========================================================================
     * 全域狀態与常數
     * ========================================================================
     */
    const UNLOCK_STORAGE_KEY = 'dict_device_unlock_token';

    let serverState = {
      keyStatus: {},
      settings: {
        ttsVoice: 'en-HK-YanNeural',
        geminiModel: 'gemini-3.6-flash',
        playbackRate: 0.8,
        repeatCount: 2,
        pauseMultiplier: 1.0
      },
      pendingTask: null,
      systemPrompt: '',
      unlockToken: null
    };

    let draftSettings = {};
    let isSettingsDirty = false;
    let isKeysDirty = false;

    let lessonsIndex = [];
    let currentLesson = null;
    let audioBlobUrls = {};
    let activeTaskState = null;

    let dictation = {
      isRunning: false,
      isPaused: false,
      chunkIdx: 0,
      pass: 1,
      timer: null
    };

    let keepAliveCtx = null;
    function ensureIosAudioKeepAlive() {
      try {
        if (!keepAliveCtx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          keepAliveCtx = new AudioCtx();
          const osc = keepAliveCtx.createOscillator();
          const gain = keepAliveCtx.createGain();
          gain.gain.value = 0.00001;
          osc.connect(gain);
          gain.connect(keepAliveCtx.destination);
          osc.start();
        }
        if (keepAliveCtx.state === 'suspended') keepAliveCtx.resume();
      } catch (e) {}
    }

    /**
     * ========================================================================
     * 本機與跨裝置「顯示文字」鎖定控制邏輯
     * ========================================================================
     */
    function isDeviceUnlocked() {
      const savedToken = localStorage.getItem(UNLOCK_STORAGE_KEY);
      if (!savedToken) return false;
      // 如已從 GAS 取得最新 token，必須完全吻合才算有效
      if (serverState.unlockToken) {
        return savedToken === serverState.unlockToken;
      }
      return true;
    }

    // 每次進入系統與 GAS 同步後，驗證本機解鎖狀態是否已被遠端撤銷
    function reconcileUnlockTokenWithServer() {
      const savedToken = localStorage.getItem(UNLOCK_STORAGE_KEY);
      if (savedToken && serverState.unlockToken && savedToken !== serverState.unlockToken) {
        // 通行證不吻合：徹底清空本機已解鎖狀態，等同從未解鎖過
        localStorage.removeItem(UNLOCK_STORAGE_KEY);
      }
      updateLockCardUI();
      updateMaskCheckboxState();
    }

    function updateLockCardUI() {
      const unlocked = isDeviceUnlocked();
      const card = document.getElementById('cardTextLock');
      const titleEl = document.getElementById('cardTextLockTitle');
      const btn = document.getElementById('btnToggleLock');
      const btnRevokeAll = document.getElementById('btnRevokeAllLocks');
      if (!card || !btn) return;

      if (unlocked) {
        card.className = "stepper-mini-card lock-card is-unlocked";
        titleEl.style.color = "#16a34a";
        btn.className = "lock-action-btn btn-to-lock";
        btn.innerText = "鎖定";
        // 已解鎖狀態下，才顯示整行的「一鍵鎖定所有裝置」按鈕
        if (btnRevokeAll) btnRevokeAll.style.display = 'inline-flex';
      } else {
        card.className = "stepper-mini-card lock-card is-locked";
        titleEl.style.color = "#dc2626";
        btn.className = "lock-action-btn btn-to-unlock";
        btn.innerText = "解鎖";
        if (btnRevokeAll) btnRevokeAll.style.display = 'none';
      }
    }

    function updateMaskCheckboxState() {
      const checkbox = document.getElementById('maskTextCheckbox');
      const lockIcon = document.getElementById('maskLockIndicator');
      if (!checkbox) return;

      const unlocked = isDeviceUnlocked();
      if (!unlocked) {
        checkbox.checked = true;
        checkbox.disabled = true;
        if (lockIcon) lockIcon.style.display = 'inline';
      } else {
        checkbox.disabled = false;
        if (lockIcon) lockIcon.style.display = 'none';
      }
      renderChunks();
    }

    async function handleLockToggle() {
      const unlocked = isDeviceUnlocked();
      const btn = document.getElementById('btnToggleLock');

      if (unlocked) {
        // 由已解鎖變成已上鎖：無需密碼，徹底清空本機紀錄（等同從未成功解鎖過）
        localStorage.removeItem(UNLOCK_STORAGE_KEY);
        updateLockCardUI();
        updateMaskCheckboxState();
      } else {
        // 由已上鎖變成解鎖：需輸入密碼向 GAS 驗證
        const pwd = window.prompt("請輸入解鎖密碼：");
        if (pwd === null || pwd.trim() === '') return;

        const origText = btn.innerText;
        btn.disabled = true;
        btn.innerHTML = `<span class="loading-hourglass">⏳</span>`;

        try {
          const res = await callGAS('verifyUnlockPassword', { password: pwd });
          if (res.valid && res.unlockToken) {
            serverState.unlockToken = res.unlockToken;
            localStorage.setItem(UNLOCK_STORAGE_KEY, res.unlockToken);
            updateLockCardUI();
            updateMaskCheckboxState();
          } else if (res.lockedOut) {
            alert(`⛔ 密碼錯誤次數過多，請等待 ${res.remainSec} 秒後再試！`);
          } else {
            alert(`❌ 密碼錯誤！（尚餘 ${res.remainingAttempts} 次嘗試機會）`);
          }
        } catch (e) {
          alert("驗證失敗: " + e.message);
        } finally {
          btn.disabled = false;
          updateLockCardUI();
        }
      }
    }

    // 一鍵鎖定全屋所有裝置
    async function handleRevokeAllDevices() {
      if (!confirm("確定要一鍵鎖定所有裝置嗎？\n（包括本機及所有已解鎖的手機進入系統後都會自動上鎖）")) return;

      const btn = document.getElementById('btnRevokeAllLocks');
      btn.disabled = true;
      btn.innerHTML = `<span class="loading-hourglass">⏳</span> 正在鎖定所有裝置...`;

      try {
        const res = await callGAS('revokeAllDevices');
        serverState.unlockToken = res.unlockToken;
        // 同時徹底清空本機解鎖紀錄
        localStorage.removeItem(UNLOCK_STORAGE_KEY);
        updateLockCardUI();
        updateMaskCheckboxState();
        alert("🔒 已成功鎖定所有裝置！");
      } catch (e) {
        alert("操作失敗: " + e.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `🔒 一鍵鎖定所有裝置`;
        updateLockCardUI();
      }
    }

    /**
     * ========================================================================
     * 初始化
     * ========================================================================
     */
    window.onload = async function() {
      updateLockCardUI();
      updateMaskCheckboxState();

      await syncInitStateFromGAS();
      await loadCatalogFromGitHub();
      document.getElementById('globalLoadingCard').style.display = 'none';
    };

    async function callGAS(action, payloadObj = {}) {
      const res = await fetch(APP_CONFIG.GAS_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, ...payloadObj })
      });
      const json = await res.json();
      if (!json.success) throw new Error(json.error || "系統連線異常");
      return json.data;
    }

    async function syncInitStateFromGAS() {
      try {
        serverState = await callGAS('getInitState');
        reconcileUnlockTokenWithServer();
        refreshKeyAlertDot();
        applyBrowserPlaybackRate();

        if (serverState.pendingTask && serverState.pendingTask.status !== 'COMPLETED') {
          activeTaskState = serverState.pendingTask;
          document.getElementById('resumeLessonName').innerText = serverState.pendingTask.title;
          document.getElementById('cloudResumeBanner').style.display = 'block';
        }
      } catch (e) {
        console.error("GAS 連線失敗:", e);
      }
    }

    function refreshKeyAlertDot() {
      const ks = serverState.keyStatus || {};
      const hasAnyTts = ks['GOOGLE_TTS_KEY'] || ks['AZURE_TTS_KEY'];
      const isReady = ks['GEMINI_API_KEY'] && ks['GITHUB_TOKEN'] && hasAnyTts;
      document.getElementById('keyMissingDot').style.display = isReady ? 'none' : 'block';
    }

    function applyBrowserPlaybackRate() {
      const player = document.getElementById('mainAudio');
      if (player) {
        player.playbackRate = Number(serverState.settings.playbackRate || 0.8);
      }
    }

    /**
     * ========================================================================
     * 畫面切換與輸入驗證
     * ========================================================================
     */
    function switchView(mode) {
      const viewAdd = document.getElementById('viewAddLesson');
      const viewPlay = document.getElementById('viewPlayer');
      const btnBack = document.getElementById('btnBackToPlayer');

      if (mode === 'ADD' || lessonsIndex.length === 0) {
        stopDictation();
        viewPlay.style.display = 'none';
        viewAdd.style.display = 'block';
        btnBack.style.display = (lessonsIndex.length > 0) ? 'inline-flex' : 'none';
        resetAddFormUI();
      } else {
        viewAdd.style.display = 'none';
        viewPlay.style.display = 'block';
      }
    }

    function resetAddFormUI() {
      document.getElementById('addFormArea').style.display = 'block';
      document.getElementById('buildProgressArea').style.display = 'none';
      document.getElementById('btnResumeOnError').style.display = 'none';
      clearSelectedImage();
      document.getElementById('jsonInputText').value = '';
      validateInputState();
    }

    function onImageSelected() {
      const fileInput = document.getElementById('ocrImageInput');
      const hint = document.getElementById('selectedImageHint');
      const nameSpan = document.getElementById('selectedImageName');

      if (fileInput.files && fileInput.files.length > 0) {
        nameSpan.innerText = "📷 " + fileInput.files[0].name;
        hint.style.display = 'flex';
      }
      validateInputState();
    }

    function clearSelectedImage() {
      const fileInput = document.getElementById('ocrImageInput');
      fileInput.value = '';
      document.getElementById('selectedImageHint').style.display = 'none';
      validateInputState();
    }

    function validateInputState() {
      const jsonText = document.getElementById('jsonInputText').value.trim();
      const hasImage = Boolean(document.getElementById('ocrImageInput').files.length > 0);
      const hint = document.getElementById('jsonValidHint');
      const btnStart = document.getElementById('btnStartBuild');

      if (jsonText.length > 0) {
        try {
          const parsed = JSON.parse(jsonText);
          const isArray = Array.isArray(parsed);
          const hasChunks = Boolean(parsed && Array.isArray(parsed.chunks));

          if (isArray || hasChunks) {
            hint.style.display = 'block';
            hint.style.color = 'var(--success)';
            hint.innerText = "✅ JSON 格式正確！將優先使用此分析內容";
            btnStart.disabled = false;
            return;
          } else {
            throw new Error("無句子陣列");
          }
        } catch (e) {
          hint.style.display = 'block';
          hint.style.color = 'var(--danger)';
          hint.innerText = "❌ JSON 格式不合，需包含句子陣列";
          btnStart.disabled = true;
          return;
        }
      }

      hint.style.display = 'none';
      btnStart.disabled = !hasImage;
    }

    function copySystemPrompt() {
      const promptText = serverState.systemPrompt || "請將課文以小學生英文讀默為目標分拆為意群純 JSON 格式。";
      navigator.clipboard.writeText(promptText).then(() => {
        const btn = document.getElementById('btnCopyPrompt');
        btn.innerText = "✅ 已複製！";
        setTimeout(() => { btn.innerText = "📋 複製 Prompt"; }, 2000);
      }).catch(() => {
        alert("無法複製，請手動確認剪貼簿權限。");
      });
    }

    /**
     * ========================================================================
     * 讀默流水線建置
     * ========================================================================
     */
    function renderProgressUI(step, totalSteps, title, actionDesc, doneCount, totalCount) {
      document.getElementById('addFormArea').style.display = 'none';
      document.getElementById('btnBackToPlayer').style.display = 'none';
      document.getElementById('buildProgressArea').style.display = 'block';

      const pct = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0;
      const remainCount = Math.max(0, totalCount - doneCount);

      document.getElementById('progStepPill').innerText = `Step ${step} / ${totalSteps}`;
      document.getElementById('progPercentText').innerText = `${pct}%`;
      document.getElementById('progTargetTitle').innerText = title;
      document.getElementById('progCurrentAction').innerHTML = `<span class="loading-hourglass">⏳</span> ` + actionDesc;
      document.getElementById('progBarFill').style.width = `${pct}%`;
      document.getElementById('progDoneStat').innerText = `已完成: ${doneCount}`;
      document.getElementById('progRemainStat').innerText = `尚餘: ${remainCount}`;
    }

    async function startBuildProcess() {
      const jsonText = document.getElementById('jsonInputText').value.trim();
      const fileInput = document.getElementById('ocrImageInput');

      document.getElementById('btnResumeOnError').style.display = 'none';
      document.getElementById('cloudResumeBanner').style.display = 'none';

      try {
        let directJson = null;
        let imageBase64 = null, imageMimeType = null;

        if (jsonText.length > 0) {
          directJson = jsonText;
        } else if (fileInput.files && fileInput.files.length > 0) {
          const f = fileInput.files[0];
          imageMimeType = f.type;
          imageBase64 = await fileToBase64(f);
        }

        renderProgressUI(1, 3, "課文意群分析中...", "正在分析課文意群...", 0, 1);

        activeTaskState = await callGAS('step1_analyzeAndPrepare', {
          payload: {
            directJson: directJson,
            imageBase64: imageBase64,
            imageMimeType: imageMimeType,
            geminiModel: serverState.settings.geminiModel,
            voiceName: serverState.settings.ttsVoice
          }
        });

        await continuePipelineFromCheckpoint();

      } catch (err) {
        handlePipelinePauseError(err.message);
      }
    }

    async function resumeFromCloudTask() {
      if (!activeTaskState) return;
      document.getElementById('cloudResumeBanner').style.display = 'none';
      switchView('ADD');
      await continuePipelineFromCheckpoint();
    }

    async function discardCloudTask() {
      document.getElementById('cloudResumeBanner').style.display = 'none';
      activeTaskState = null;
      await callGAS('discardPendingTask');
    }

    async function continuePipelineFromCheckpoint() {
      if (!activeTaskState) return;
      document.getElementById('btnResumeOnError').style.display = 'none';

      try {
        const total = activeTaskState.chunks.length;
        const batchSize = APP_CONFIG.TTS_BATCH_SIZE || 5;

        for (let i = 0; i < total; i += batchSize) {
          const currentChunks = activeTaskState.chunks;
          const slice = currentChunks.slice(i, i + batchSize);
          const needsWork = slice.some(c => !c.driveFileId || !c.gitBlobSha);

          if (needsWork) {
            const doneSoFar = currentChunks.filter(c => c.driveFileId && c.gitBlobSha).length;
            const batchIndices = slice.map(c => c.index);
            const startNum = batchIndices[0] + 1;
            const endNum = batchIndices[batchIndices.length - 1] + 1;

            renderProgressUI(
              2, 3,
              activeTaskState.title,
              `正在處理第 ${startNum} ~ ${endNum} 句語音...`,
              doneSoFar,
              total
            );

            const step2Res = await callGAS('step2_schemeB_batchTTSAndBlobs', {
              payload: {
                batchIndices: batchIndices,
                driveFolderId: activeTaskState.driveFolderId,
                ghConfig: APP_CONFIG.GITHUB
              }
            });

            if (step2Res.updatedFullState) {
              activeTaskState = step2Res.updatedFullState;
            }

            if (!step2Res.batchSuccess) {
              throw new Error(step2Res.error || "處理中斷");
            }

            const updatedDone = activeTaskState.chunks.filter(c => c.driveFileId && c.gitBlobSha).length;
            renderProgressUI(
              2, 3,
              activeTaskState.title,
              `第 ${startNum} ~ ${endNum} 句處理完成`,
              updatedDone,
              total
            );
          }
        }

        renderProgressUI(3, 3, activeTaskState.title, "正在同步課文清單...", total, total);

        const step3Res = await callGAS('step3_commitToGitHub', {
          payload: {
            driveFolderId: activeTaskState.driveFolderId,
            ghConfig: APP_CONFIG.GITHUB
          }
        });

        renderProgressUI(3, 3, activeTaskState.title, "已完成！正在載入...", total, total);

        lessonsIndex = step3Res.indexList;
        const newLessonId = step3Res.lesson.id;
        activeTaskState = null;

        renderCatalogDropdown();
        switchView('PLAYER');
        await selectLesson(newLessonId);

      } catch (err) {
        handlePipelinePauseError(err.message);
      }
    }

    function handlePipelinePauseError(msg) {
      document.getElementById('progCurrentAction').innerHTML =
        `<span style="color:var(--danger); font-weight:700;">⚠️ ${escapeHtml(msg)}</span>`;
      document.getElementById('btnResumeOnError').style.display = 'inline-flex';
      if (lessonsIndex.length > 0) {
        document.getElementById('btnBackToPlayer').style.display = 'inline-flex';
      }
    }

    /**
     * ========================================================================
     * 課文目錄與播放引擎
     * ========================================================================
     */
    function getRawUrl(path) {
      const { owner, assetsRepo, branch } = APP_CONFIG.GITHUB;
      return `https://raw.githubusercontent.com/${owner}/${assetsRepo}/${branch}/${path}?t=${Date.now()}`;
    }

    function getCdnUrl(path) {
      const { owner, assetsRepo, branch } = APP_CONFIG.GITHUB;
      return `https://cdn.jsdelivr.net/gh/${owner}/${assetsRepo}@${branch}/${path}`;
    }

    async function loadCatalogFromGitHub() {
      try {
        const res = await fetch(getRawUrl('lessons/index.json'));
        lessonsIndex = res.ok ? await res.json() : [];
      } catch (e) {
        lessonsIndex = [];
      }

      if (lessonsIndex.length === 0) {
        switchView('ADD');
      } else {
        renderCatalogDropdown();
        switchView('PLAYER');
        await selectLesson(lessonsIndex[0].id);
      }
    }

    function renderCatalogDropdown() {
      const sel = document.getElementById('lessonDropdown');
      sel.innerHTML = lessonsIndex.map(item => `
        <option value="${item.id}" ${currentLesson && currentLesson.id === item.id ? 'selected' : ''}>
          ${escapeHtml(item.title)}
        </option>
      `).join('');
    }

    async function selectLesson(lessonId) {
      stopDictation();
      const banner = document.getElementById('playerBanner');
      banner.innerHTML = `<span class="loading-hourglass">⏳</span> 正在載入音檔...`;
      document.getElementById('btnPlay').disabled = true;

      // 切換課文時預設為隱藏文字，並根據本機鎖定狀態控制可否取消勾選
      document.getElementById('maskTextCheckbox').checked = true;
      updateMaskCheckboxState();

      try {
        const res = await fetch(getRawUrl(`lessons/lesson_${lessonId}.json`));
        if (!res.ok) throw new Error("讀取失敗");
        currentLesson = await res.json();

        renderCatalogDropdown();
        renderChunks();

        Object.values(audioBlobUrls).forEach(u => URL.revokeObjectURL(u));
        audioBlobUrls = {};

        let loaded = 0;
        const total = currentLesson.chunks.length;

        await Promise.all(currentLesson.chunks.map(async (chunk) => {
          let blobUrl = null;
          try {
            const r = await fetch(getCdnUrl(chunk.audioPath));
            if (r.ok) {
              const b = await r.blob();
              blobUrl = URL.createObjectURL(b);
            }
          } catch (e) {}

          if (!blobUrl) {
            const fb = await callGAS('fallbackGetAudio', {
              payload: {
                lessonTitle: currentLesson.title,
                voiceName: currentLesson.voiceName,
                chunk: chunk
              }
            });
            blobUrl = fb.audioData;
          }

          audioBlobUrls[chunk.index] = blobUrl;
          loaded++;
          banner.innerHTML = `<span class="loading-hourglass">⏳</span> 載入音檔中 (${loaded}/${total})...`;
        }));

        banner.innerText = `✅ 已準備就緒`;
        document.getElementById('btnPlay').disabled = false;
        document.getElementById('btnReplay').disabled = false;

      } catch (err) {
        banner.innerText = "❌ 載入失敗: " + err.message;
      }
    }

    // 漏洞 3 防護：隱藏文字時直接將底層英文字母與數字替換為圓點，杜絕頁內搜尋與複製偷看
    function maskEnglishChars(str) {
      return escapeHtml(String(str).replace(/[a-zA-Z0-9]/g, '●'));
    }

    function renderChunks() {
      const cont = document.getElementById('chunkListContainer');
      if (!currentLesson) { cont.innerHTML = ''; return; }

      const isMasked = document.getElementById('maskTextCheckbox').checked;
      const mult = Number(serverState.settings.pauseMultiplier || 1.0);

      cont.innerHTML = currentLesson.chunks.map((c, idx) => {
        const waitSec = Math.max(1, Math.round(c.pauseSeconds * mult));
        const isActive = dictation.isRunning && dictation.chunkIdx === idx;
        const contentStr = isMasked ? maskEnglishChars(c.text) : escapeHtml(c.text);
        const displayText = c.isTitle ? `📌 題目：${contentStr}` : `${c.index}. ${contentStr}`;
        return `
          <div id="chunk_row_${idx}" class="chunk-card ${isActive ? 'active' : ''}" onclick="playSinglePreview(${idx})">
            <span class="chunk-text ${isMasked ? 'masked' : ''}">${displayText}</span>
            <span class="chunk-badge">停 ${waitSec}s</span>
          </div>
        `;
      }).join('');
    }

    async function deleteCurrentLesson() {
      if (!currentLesson) return;
      if (!confirm(`確定要刪除「${currentLesson.title}」嗎？`)) return;

      document.getElementById('playerBanner').innerHTML = `<span class="loading-hourglass">⏳</span> 刪除中...`;
      try {
        const res = await callGAS('deleteLesson', {
          payload: { lessonId: currentLesson.id, ghConfig: APP_CONFIG.GITHUB }
        });
        lessonsIndex = res.indexList;
        currentLesson = null;
        if (lessonsIndex.length === 0) {
          switchView('ADD');
        } else {
          renderCatalogDropdown();
          await selectLesson(lessonsIndex[0].id);
        }
      } catch (e) {
        alert("刪除失敗: " + e.message);
      }
    }

    function playSinglePreview(idx) {
      if (!currentLesson || !audioBlobUrls[idx]) return;
      stopDictation();
      ensureIosAudioKeepAlive();

      dictation.chunkIdx = idx;
      highlightActiveChunk(idx);

      const chunk = currentLesson.chunks[idx];
      const player = document.getElementById('mainAudio');
      player.src = audioBlobUrls[idx];
      player.playbackRate = Number(serverState.settings.playbackRate || 0.8);
      player.onended = null;
      player.play();

      const label = chunk.isTitle ? "【題目】" : `第 ${chunk.index} 句`;
      document.getElementById('playerBanner').innerText = `🔊 單句朗讀：${label}`;
    }

    function startOrResumeDictation() {
      if (!currentLesson) return;
      ensureIosAudioKeepAlive();

      if (dictation.isRunning && dictation.isPaused) {
        dictation.isPaused = false;
        document.getElementById('btnPlay').disabled = true;
        document.getElementById('btnPause').disabled = false;
        runDictationCycle();
        return;
      }

      dictation.isRunning = true;
      dictation.isPaused = false;
      dictation.chunkIdx = 0;
      dictation.pass = 1;

      document.getElementById('btnPlay').disabled = true;
      document.getElementById('btnPause').disabled = false;
      document.getElementById('btnStop').disabled = false;

      runDictationCycle();
    }

    function runDictationCycle() {
      if (!dictation.isRunning || dictation.isPaused || !currentLesson) return;

      const idx = dictation.chunkIdx;
      const total = currentLesson.chunks.length;
      const maxPasses = Number(serverState.settings.repeatCount || 2);

      if (idx >= total) {
        stopDictation();
        document.getElementById('playerBanner').innerText = "🎉 全篇讀默完成！";
        return;
      }

      const chunk = currentLesson.chunks[idx];
      highlightActiveChunk(idx);

      const banner = document.getElementById('playerBanner');
      const label = chunk.isTitle ? "【題目】" : `第 ${chunk.index}/${total - 1} 句`;
      banner.innerText = `🔊 朗讀中：${label} (第 ${dictation.pass}/${maxPasses} 次)`;

      const player = document.getElementById('mainAudio');
      player.src = audioBlobUrls[idx];
      player.playbackRate = Number(serverState.settings.playbackRate || 0.8);

      player.onended = () => {
        if (!dictation.isRunning || dictation.isPaused) return;

        const mult = Number(serverState.settings.pauseMultiplier || 1.0);
        let remain = Math.max(1, Math.round(chunk.pauseSeconds * mult));
        const waitLabel = chunk.isTitle ? "請默寫題目..." : `默寫停頓中...`;
        banner.innerText = `✍️ ${waitLabel} (${remain} 秒)`;

        clearInterval(dictation.timer);
        dictation.timer = setInterval(() => {
          if (dictation.isPaused || !dictation.isRunning) {
            clearInterval(dictation.timer);
            return;
          }
          remain--;
          if (remain > 0) {
            banner.innerText = `✍️ ${waitLabel} (${remain} 秒)`;
          } else {
            clearInterval(dictation.timer);
            if (dictation.pass < maxPasses) {
              dictation.pass++;
            } else {
              dictation.chunkIdx++;
              dictation.pass = 1;
            }
            runDictationCycle();
          }
        }, 1000);
      };

      player.play().catch(() => {
        banner.innerText = "⚠️ 請點擊「繼續」解鎖播放";
        pauseDictation();
      });
    }

    function pauseDictation() {
      if (!dictation.isRunning) return;
      dictation.isPaused = true;
      clearInterval(dictation.timer);
      document.getElementById('mainAudio').pause();

      const btn = document.getElementById('btnPlay');
      btn.innerText = "▶ 繼續";
      btn.disabled = false;
      document.getElementById('btnPause').disabled = true;
      document.getElementById('playerBanner').innerText = "⏸ 已暫停";
    }

    function stopDictation() {
      dictation.isRunning = false;
      dictation.isPaused = false;
      clearInterval(dictation.timer);

      const player = document.getElementById('mainAudio');
      player.pause();
      player.onended = null;

      const btn = document.getElementById('btnPlay');
      btn.innerText = "▶ 開始讀默";
      btn.disabled = !currentLesson;
      document.getElementById('btnPause').disabled = true;
      document.getElementById('btnStop').disabled = true;
      highlightActiveChunk(-1);
    }

    function replayCurrentChunk() {
      if (!currentLesson) return;
      clearInterval(dictation.timer);
      if (dictation.isRunning) {
        dictation.isPaused = false;
        runDictationCycle();
      } else {
        playSinglePreview(dictation.chunkIdx || 0);
      }
    }

    function highlightActiveChunk(activeIdx) {
      if (!currentLesson) return;
      currentLesson.chunks.forEach((_, i) => {
        const el = document.getElementById(`chunk_row_${i}`);
        if (el) {
          if (i === activeIdx) {
            el.classList.add('active');
            el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          } else {
            el.classList.remove('active');
          }
        }
      });
    }

    /**
     * ========================================================================
     * Key Modal 控制
     * ========================================================================
     */
    function openKeyModal() {
      isKeysDirty = false;
      document.getElementById('btnKeySubmit').innerText = "關閉";

      const keyDefs = [
        { id: 'GEMINI_API_KEY', name: 'Gemini API Key' },
        { id: 'GOOGLE_TTS_KEY', name: 'Google Cloud TTS Key' },
        { id: 'AZURE_TTS_KEY', name: 'Microsoft Azure TTS Key' },
        { id: 'GITHUB_TOKEN', name: 'GitHub Personal Token' }
      ];

      const container = document.getElementById('keyItemsContainer');
      container.innerHTML = keyDefs.map(k => {
        const isSet = Boolean(serverState.keyStatus && serverState.keyStatus[k.id]);
        if (isSet) {
          return `
            <div class="key-item">
              <div class="key-title">${k.name}</div>
              <div style="margin-top:6px;" onclick="toggleKeyInputBox('${k.id}')">
                <span class="badge-tag ok">✅ 已設定 (點擊修改)</span>
              </div>
              <div id="key_wrap_${k.id}" style="display:none; margin-top:8px;">
                <input type="password" id="key_input_${k.id}" placeholder="輸入新金鑰以覆蓋" oninput="markKeysDirty()">
              </div>
            </div>
          `;
        } else {
          return `
            <div class="key-item">
              <div class="key-row-inline">
                <span class="key-title">${k.name}</span>
                <span class="badge-tag warn">⚠️ 尚未設定</span>
              </div>
              <div style="margin-top:8px;">
                <input type="password" id="key_input_${k.id}" placeholder="請貼上 ${k.name}" oninput="markKeysDirty()">
              </div>
            </div>
          `;
        }
      }).join('');

      openModal('keyModal');
    }

    function toggleKeyInputBox(keyId) {
      const wrap = document.getElementById(`key_wrap_${keyId}`);
      if (!wrap) return;
      const isHidden = wrap.style.display === 'none';
      wrap.style.display = isHidden ? 'block' : 'none';
      if (isHidden) {
        const inp = document.getElementById(`key_input_${keyId}`);
        if (inp) inp.focus();
      }
    }

    function markKeysDirty() {
      isKeysDirty = true;
      document.getElementById('btnKeySubmit').innerText = "儲存並關閉";
    }

    function closeKeyModal() {
      closeModal('keyModal');
    }

    async function onKeyModalSubmit() {
      if (!isKeysDirty) {
        closeKeyModal();
        return;
      }

      const btn = document.getElementById('btnKeySubmit');
      btn.disabled = true;
      btn.innerHTML = `<span class="loading-hourglass">⏳</span> 儲存中...`;

      const keys = {};
      ['GEMINI_API_KEY', 'GOOGLE_TTS_KEY', 'AZURE_TTS_KEY', 'GITHUB_TOKEN'].forEach(k => {
        const el = document.getElementById(`key_input_${k}`);
        if (el && el.value.trim() !== '') {
          keys[k] = el.value.trim();
        }
      });

      try {
        serverState = await callGAS('saveKeys', { keys });
        refreshKeyAlertDot();
        closeKeyModal();
      } catch (e) {
        alert("儲存失敗: " + e.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "關閉";
      }
    }

    /**
     * ========================================================================
     * 系統設定 Modal 控制
     * ========================================================================
     */
    function openSettingsModal() {
      isSettingsDirty = false;
      document.getElementById('btnSettingsSubmit').innerText = "關閉";

      draftSettings = {
        ttsVoice: serverState.settings.ttsVoice || 'en-HK-YanNeural',
        geminiModel: serverState.settings.geminiModel || 'gemini-3.6-flash',
        playbackRate: Number(serverState.settings.playbackRate || 0.8),
        repeatCount: Number(serverState.settings.repeatCount || 2),
        pauseMultiplier: Number(serverState.settings.pauseMultiplier || 1.0)
      };

      document.getElementById('setVoiceSelect').value = draftSettings.ttsVoice;
      document.getElementById('setGeminiSelect').value = draftSettings.geminiModel;

      refreshMiniStepperDisplay('playbackRate', 2);
      refreshMiniStepperDisplay('repeatCount', 0);
      refreshMiniStepperDisplay('pauseMultiplier', 1);

      updateLockCardUI();
      openModal('settingsModal');
    }

    function markSettingsDirty() {
      isSettingsDirty = true;
      document.getElementById('btnSettingsSubmit').innerText = "儲存並關閉";
    }

    function stepSetting(field, delta, minVal, maxVal, decimals) {
      let nextVal = Number(draftSettings[field]) + delta;
      if (nextVal < minVal) nextVal = minVal;
      if (nextVal > maxVal) nextVal = maxVal;
      draftSettings[field] = Number(nextVal.toFixed(decimals));
      refreshMiniStepperDisplay(field, decimals);
      markSettingsDirty();
    }

    function refreshMiniStepperDisplay(field, decimals) {
      const el = document.getElementById(`input_${field}`);
      if (el) {
        el.value = decimals > 0 ? Number(draftSettings[field]).toFixed(decimals) : String(draftSettings[field]);
      }
    }

    function closeSettingsModal() {
      closeModal('settingsModal');
    }

    async function onSettingsModalSubmit() {
      if (!isSettingsDirty) {
        closeSettingsModal();
        return;
      }

      const btn = document.getElementById('btnSettingsSubmit');
      btn.disabled = true;
      btn.innerHTML = `<span class="loading-hourglass">⏳</span> 同步中...`;

      draftSettings.ttsVoice = document.getElementById('setVoiceSelect').value;
      draftSettings.geminiModel = document.getElementById('setGeminiSelect').value;

      serverState.settings = { ...draftSettings };
      applyBrowserPlaybackRate();
      renderChunks();

      try {
        serverState = await callGAS('saveSettings', { settings: draftSettings });
        closeSettingsModal();
      } catch (e) {
        alert("儲存設定失敗: " + e.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "關閉";
      }
    }

    /**
     * ========================================================================
     * 工具函數
     * ========================================================================
     */
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, s => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[s]));
    }
  </script>
